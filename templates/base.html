{% load static %}<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Travel Personality Detector{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/kiosk.css' %}">
    {% block head %}{% endblock %}
    <script src="{% static 'js/vendor/htmx.min.js' %}" defer></script>
    <script src="{% static 'js/vendor/alpine.min.js' %}" defer></script>
</head>
<body class="min-h-screen bg-brand-night text-white antialiased"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    {% block content %}{% endblock %}
</body>
</html>
