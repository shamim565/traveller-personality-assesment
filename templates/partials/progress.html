<div class="flex items-center gap-6 p-8">
    <div class="h-5 flex-1 overflow-hidden rounded-full bg-white/20" role="progressbar"
         aria-valuemin="0" aria-valuemax="{{ total }}" aria-valuenow="{{ current }}">
        <div class="h-full rounded-full bg-brand-sand transition-all duration-500"
             style="width: {% widthratio current total 100 %}%"></div>
    </div>
    <span class="whitespace-nowrap text-2xl font-semibold">
        {% if LANG == "en" %}Question {{ current }} / {{ total }}{% else %}প্রশ্ন {{ current }} / {{ total }}{% endif %}
    </span>
</div>
