{% include "partials/progress.html" %}
<div x-data="kioskReveal" x-show="show" x-transition.opacity.duration.300ms
     data-guard="1"
     class="flex flex-1 flex-col items-center justify-center gap-10 p-10 text-center">
    <h1 class="max-w-5xl text-5xl font-bold leading-snug md:text-6xl">{{ question.text_bn }}</h1>
    <div class="grid w-full max-w-6xl grid-cols-1 gap-6 md:grid-cols-2">
        {% for option in options %}
            <button
                x-data="kioskPress"
                @pointerdown="down()"
                @pointerup="up()"
                @pointerleave="up()"
                :class="pressed ? 'scale-[0.97]' : ''"
                class="rounded-3xl border-4 border-white/15 bg-brand-night/70 px-8 py-9 text-3xl leading-snug backdrop-blur-sm transition-all duration-100 hover:border-white/40 focus:outline-none focus-visible:ring-4 focus-visible:ring-brand-sand md:text-4xl"
                hx-post="{% url 'experience:answer' %}"
                hx-vals='{"answer_id": {{ option.id }}}'
                hx-target="#experience"
                hx-swap="innerHTML"
                hx-disabled-elt="this">
                {{ option.text_bn }}
            </button>
        {% endfor %}
    </div>
</div>
