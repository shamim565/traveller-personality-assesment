name: travel-persona

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_persona}
      POSTGRES_USER: ${POSTGRES_USER:-travel_persona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-travel_persona} -d ${POSTGRES_DB:-travel_persona}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: travel-persona-nginx
    ports:
      - "127.0.0.1:8010:80"
    volumes:
      - ./deploy/vps/persona-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - web
    networks:
      - default
      - shared
    restart: unless-stopped

networks:
  default:
  shared:
    external: true
    name: ruletheday-backend_default

volumes:
  pgdata:
  static_files:
