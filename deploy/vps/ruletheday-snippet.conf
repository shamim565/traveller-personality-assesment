# Append this block to /opt/ruletheday-backend/nginx/nginx.conf so the
# ruletheday nginx (owner of :80/:443) routes persona.ruletheday.app to the
# travel-persona stack (container "travel-persona-nginx" on the shared
# ruletheday-backend_default network).
#
# After appending:
#   docker exec ruletheday-backend-nginx-1 nginx -t
#   docker exec ruletheday-backend-nginx-1 nginx -s reload

# BEGIN travel-persona
server {
    listen 80;
    server_name persona.ruletheday.app;

    # Let's Encrypt ACME challenge (webroot renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name persona.ruletheday.app;

    ssl_certificate     /etc/letsencrypt/live/persona.ruletheday.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/persona.ruletheday.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 5m;
    add_header X-Robots-Tag "noindex" always;

    location / {
        proxy_pass http://travel-persona-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
# END travel-persona
